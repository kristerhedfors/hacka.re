[pytest]
# Configure test discovery
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Configure output formatting
console_output_style = progress
log_cli = true
log_cli_level = INFO

# Configure Playwright-specific options
# Keep --headed for now as tests were developed with it
# Tests run reliably in headed mode with proper browser context isolation
addopts = --browser chromium --maxfail=1000 --ignore=test_organization --timeout=120 --headed

# pytest-xdist configuration
# --dist=loadfile: Tests from same file run on same worker (maintains test isolation)
# This prevents interference between tests that share setup/teardown logic

# Test markers
markers =
    oauth: OAuth 2.1 specification tests
    integration: Integration tests across components
    transport: Transport layer tests
    stdio: stdio proxy tests
    metadata: Metadata discovery tests
    registration: Client registration tests
    compliance: OAuth 2.1 compliance tests
    requires_shodan_api: Tests requiring Shodan API key
    requires_github_token: Tests requiring GitHub PAT or OAuth
    requires_openai_key: Tests requiring OpenAI API key
    requires_groq_key: Tests requiring Groq API key
    requires_berget_key: Tests requiring Berget API key
    shodan_premium: Tests requiring Shodan premium account features
    feature_test: Feature-specific integration tests
    slow: Tests that take longer than 30 seconds
